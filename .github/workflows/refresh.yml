name: Refresh Macro Data

on:
  schedule:
    # 03:30 UTC = 09:00 IST daily
    - cron: "30 3 * * *"
  workflow_dispatch:        # Allow manual trigger from GitHub UI

permissions:
  contents: write           # Needed to commit data files back to repo

jobs:
  fetch-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # 1. Check out the repo
      - name: Checkout repo
        uses: actions/checkout@v4

      # 2. Set up Python 3.11
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 3. Install dependencies
      - name: Install dependencies
        run: |
          pip install --quiet requests yfinance

      # 4. Run the fetcher
      - name: Run fetch_macro.py
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python scripts/fetch_macro.py

      # 5. Commit updated data files (only if changed)
      - name: Commit data update
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/macro.json
          git diff --cached --quiet || git commit -m "chore: macro data refresh $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
